name: Godot Phone Preview 3.1

on:
  push:
    branches: [phone-editor-preview3-polish-20260914]
    paths:
      - 'phone_editor/**'
      - '.github/workflows/phone-editor-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-editor-preview-31
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recipe
          persist-credentials: false
      - name: Checkout pinned Godot 4.7.2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: godotengine/godot
          ref: ed1daf0bf001b61586d9930840f2f1394092c079
          path: godot
          persist-credentials: false
      - name: Validate and apply candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p layout-evidence
          test "$(git -C godot rev-parse HEAD)" = ed1daf0bf001b61586d9930840f2f1394092c079
          python recipe/phone_editor/test_mobile_patch_v3.py godot 2>&1 | tee layout-evidence/source-tests.txt
          python recipe/phone_editor/apply_mobile_patch_v3.py godot > layout-evidence/patch-manifest.json
          git -C godot diff --check
      - name: Install Linux geometry test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev libpulse-dev xvfb xauth libgl1-mesa-dri imagemagick gdb
          pip install scons==4.8.1
      - name: Restore exact shared editor binary
        id: linux-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: godot/bin/godot.linuxbsd.editor.x86_64
          key: phone-layout-linux-v3-ed1daf0b-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('recipe/phone_editor/apply_mobile_patch_v3.py', 'recipe/phone_editor/preview3.patch', 'recipe/phone_editor/preview3-manifest.json') }}
      - name: Restore validated SCons object cache
        if: steps.linux-cache.outputs.cache-hit != 'true'
        id: linux-objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/phone-scons-layout
          key: phone-layout-objects-v3-ed1daf0b-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('recipe/phone_editor/preview3.patch') }}
          restore-keys: |
            phone-layout-objects-v3-ed1daf0b-${{ runner.os }}-${{ env.ImageVersion }}-
      - name: Compile shared editor layout code
        if: steps.linux-cache.outputs.cache-hit != 'true'
        working-directory: godot
        run: scons platform=linuxbsd target=editor arch=x86_64 optimize=none debug_symbols=no vulkan=no wayland=no accesskit=no dbus=no speechd=no cache_path="$RUNNER_TEMP/phone-scons-layout" cache_limit=2 -j2
      - name: Save compiled binary before running UI checks
        if: steps.linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: godot/bin/godot.linuxbsd.editor.x86_64
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}
      - name: Save validated SCons objects for small source fixes
        if: steps.linux-cache.outputs.cache-hit != 'true' && steps.linux-objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/phone-scons-layout
          key: ${{ steps.linux-objects.outputs.cache-primary-key }}
      - name: Record and preserve compiled editor
        run: |
          sha256sum godot/bin/godot.linuxbsd.editor.x86_64 > layout-evidence/LINUX-BINARY-SHA256.txt
          git -C recipe rev-parse HEAD > layout-evidence/RECIPE-COMMIT.txt
      - name: Upload test binary for diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot-phone-preview-3.1-linux-test-binary
          path: godot/bin/godot.linuxbsd.editor.x86_64
          retention-days: 7
          if-no-files-found: error
      - name: Exercise unified tabs, native touch and text actions at 150 and 200 percent
        shell: bash
        run: |
          set -euo pipefail
          phone_editor_bin="$GITHUB_WORKSPACE/godot/bin/godot.linuxbsd.editor.x86_64"
          test -x "$phone_editor_bin"
          phone_probe_failed=0
          for phone_scale in 1.5 2.0; do
            export XDG_CONFIG_HOME="$RUNNER_TEMP/phone-config-$phone_scale"
            export XDG_DATA_HOME="$RUNNER_TEMP/phone-data-$phone_scale"
            export XDG_CACHE_HOME="$RUNNER_TEMP/phone-cache-$phone_scale"
            export PHONE_LAYOUT_SCALE="$phone_scale"
            export PHONE_LAYOUT_OUTPUT="$GITHUB_WORKSPACE/layout-evidence/scale-$phone_scale"
            mkdir -p "$PHONE_LAYOUT_OUTPUT"
            if ! PHONE_LAYOUT_BOOTSTRAP=1 timeout 120 "$phone_editor_bin" --headless --editor --path recipe/phone_editor/layout_probe_v3 2>&1 | tee "$PHONE_LAYOUT_OUTPUT/bootstrap.log"; then
              phone_probe_failed=1
              continue
            fi
            if ! LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 2560x2560x24' python recipe/phone_editor/run_layout_probe.py "$phone_editor_bin" recipe/phone_editor/layout_probe_v3 2>&1 | tee "$PHONE_LAYOUT_OUTPUT/runtime.log"; then
              phone_probe_failed=1
            fi
            if ! python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert not r["failures"], r["failures"]; assert len(r["observations"]) >= 24' "$PHONE_LAYOUT_OUTPUT/geometry.json"; then
              phone_probe_failed=1
            fi
          done
          exit "$phone_probe_failed"
      - name: Preserve real UI captures and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot-phone-preview-3.1-layout
          path: layout-evidence/
          if-no-files-found: warn
          retention-days: 30
  editor:
    needs: layout
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout isolated build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recipe
          persist-credentials: false
      - name: Checkout pinned Godot 4.7.2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: godotengine/godot
          ref: ed1daf0bf001b61586d9930840f2f1394092c079
          path: godot
          persist-credentials: false
      - name: Verify base and patch contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C godot rev-parse HEAD)" = ed1daf0bf001b61586d9930840f2f1394092c079
          mkdir -p evidence
          python recipe/phone_editor/test_mobile_patch_v3.py godot 2>&1 | tee evidence/source-tests.txt
          python recipe/phone_editor/apply_mobile_patch_v3.py godot | tee evidence/patch-manifest.json
          git -C godot diff --check
          git -C godot diff --binary > evidence/GODOT-PHONE-PREVIEW-3.1.patch
          cp recipe/phone_editor/README-v3.md evidence/README.md
          git -C recipe rev-parse HEAD > evidence/RECIPE-COMMIT.txt
          git -C godot rev-parse HEAD > evidence/GODOT-COMMIT.txt
      - name: Download exact JDK with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/phone-jdk.tar.gz" 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz'
          printf '3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e  %s\n' "$RUNNER_TEMP/phone-jdk.tar.gz" | sha256sum --check --strict
      - name: Set up verified JDK archive
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: jdkfile
          java-version: '17'
          jdkFile: ${{ runner.temp }}/phone-jdk.tar.gz
      - name: Set up Android SDK
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
      - name: Install fixed build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'
          pip install scons==4.8.1
          {
            java -version
            javac -version
            scons --version
            uname -a
            printenv ImageOS ImageVersion
            cat "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
            cat "$ANDROID_HOME/build-tools/36.1.0/source.properties"
          } > evidence/toolchain.txt 2>&1
      - name: Install upstream frame pacing library
        working-directory: godot
        run: python misc/scripts/install_swappy_android.py
      - name: Record frame pacing dependency
        run: sha256sum godot/thirdparty/swappy-frame-pacing/*/libswappy_static.a > evidence/SWAPPY-SHA256.txt
      - name: Verify configured debug signing key before compilation
        working-directory: godot/platform/android/java
        run: |
          ./gradlew :editor:signingReport --no-daemon > "$GITHUB_WORKSPACE/evidence/gradle-signing-report.txt"
          python - <<'PY'
          import os, pathlib, re
          text = (pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'evidence/gradle-signing-report.txt').read_text()
          blocks = re.split(r'(?m)^Variant: ', text)
          block = next(b for b in blocks if b.startswith('androidDebug\n'))
          assert 'SHA-256: 92:15:64:D5:0B:12:5F:C1:DF:BE:22:09:BE:47:5E:D2:17:2A:DF:8B:E7:F4:72:53:2F:21:28:19:71:5D:3E:8C' in block, block
          print('Configured debug certificate matches the pinned test key.')
          PY
      - name: Restore exact compiled ARM64 library
        id: android-native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: godot/platform/android/java/lib/libs/tools/debug/arm64-v8a
          key: phone-android-v31-ed1daf0b-ndk29014206865-scons481-production-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('recipe/phone_editor/preview3.patch', 'recipe/phone_editor/preview3-manifest.json', 'recipe/phone_editor/apply_mobile_patch_v3.py', 'evidence/SWAPPY-SHA256.txt') }}
      - name: Compile ARM64 editor
        if: steps.android-native-cache.outputs.cache-hit != 'true'
        working-directory: godot
        run: scons platform=android target=editor arch=arm64 production=yes -j2
      - name: Save compiled ARM64 library before packaging
        if: steps.android-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: godot/platform/android/java/lib/libs/tools/debug/arm64-v8a
          key: ${{ steps.android-native-cache.outputs.cache-primary-key }}
      - name: Record the compiled ARM64 libraries
        run: sha256sum godot/platform/android/java/lib/libs/tools/debug/arm64-v8a/*.so > evidence/ANDROID-NATIVE-SHA256.txt
      - name: Package test-signed editor
        working-directory: godot/platform/android/java
        run: ./gradlew generateGodotEditor --no-daemon
      - name: Verify APK identity, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          phone_apks=(godot/bin/android_editor_builds/*.apk)
          test "${#phone_apks[@]}" -gt 0
          mkdir -p deliverables
          for phone_apk in "${phone_apks[@]}"; do
            phone_name=$(basename "$phone_apk")
            phone_id=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$phone_apk")
            case "$phone_id" in
              org.godotengine.editor.v4.phonepreview31.debug|org.godotengine.editor.v4.phonepreview31.release) ;;
              *) echo 'Unexpected application ID; refusing artifact'; exit 1 ;;
            esac
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$phone_apk" > "evidence/$phone_name-signature.txt"
            grep -q 'certificate SHA-256 digest: 921564d50b125fc1dfbe2209be475ed2172adf8be7f472532f212819715d3e8c' "evidence/$phone_name-signature.txt"
            "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 4 "$phone_apk" > "evidence/$phone_name-alignment.txt"
            python recipe/phone_editor/verify_apk.py "$phone_apk" > "evidence/$phone_name-contents.json"
            printf '%s %s\n' "$phone_id" "$phone_name" >> evidence/APPLICATION-IDS.txt
            cp "$phone_apk" deliverables/
          done
          (cd deliverables && sha256sum *.apk) > evidence/APK-SHA256.txt
          cp evidence/APK-SHA256.txt deliverables/
          cp recipe/phone_editor/README-v3.md deliverables/
      - name: Upload APK only after verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot-phone-preview-3.1-apk
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve checks and patch even on build failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot-phone-preview-3.1-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
